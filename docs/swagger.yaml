host: пиявкипобеда.рф
info:
  contact:
    email: mmishin2107@gmail.com
    name: API Support
  description: Backend service for Leech-ru platform. Uses cookie-based authentication
    with HttpOnly tokens.
  title: Leech API
  version: "1.0"
paths:
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Refreshes access and refresh tokens using valid refresh token from
        cookies
      parameters:
      - description: Must be 'true'
        enum:
        - "true"
        in: query
        name: goyda
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Successful updated
        "400":
          description: Invalid request or validation error
          schema:
            $ref: '#/definitions/dto.HTTPStatus'
        "401":
          description: Unauthorized - invalid/missing refresh token
          schema:
            $ref: '#/definitions/dto.HTTPStatus'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.HTTPStatus'
      summary: Refresh tokens
      tags:
      - auth
  /api/v1/cosmetics:
    get:
      consumes:
      - application/json
      description: Retrieves a list of cosmetics filtered by category, volume, title,
        etc.
      parameters:
      - description: Max number of items
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Offset for pagination
        in: query
        minimum: 0
        name: offset
        type: integer
      - description: Category enum (0–8)
        enum:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
        - 8
        in: query
        name: category
        type: integer
      - description: Filter by title prefix
        in: query
        name: titlePrefix
        type: string
      - description: Exact volume in ml
        in: query
        maximum: 10000
        minimum: 1
        name: volume
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.Cosmetics'
            type: array
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/dto.HTTPStatus'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.HTTPStatus'
      summary: Get cosmetics by filters
      tags:
      - cosmetics
    post:
      consumes:
      - application/json
      description: Creates a new cosmetic product with provided details.
      parameters:
      - description: Cosmetic product data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCosmeticsRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CreateCosmeticsResponse'
        "400":
          description: Invalid request body or validation error
          schema:
            $ref: '#/definitions/dto.HTTPStatus'
        "409":
          description: 'Conflict: invalid cosmetics format'
          schema:
            $ref: '#/definitions/dto.HTTPStatus'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.HTTPStatus'
      security:
      - CookieAuth: []
      summary: Create a new cosmetic product
      tags:
      - cosmetics
  /api/v1/cosmetics/{id}:
    delete:
      description: Deletes the cosmetic product with the given UUID.
      parameters:
      - description: Cosmetic ID (UUID)
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Successfully deleted
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/dto.HTTPStatus'
        "404":
          description: Cosmetic not found
          schema:
            $ref: '#/definitions/dto.HTTPStatus'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.HTTPStatus'
      security:
      - CookieAuth: []
      summary: Delete cosmetic by ID
      tags:
      - cosmetics
    get:
      consumes:
      - application/json
      description: Retrieves a cosmetic product using its UUID.
      parameters:
      - description: Cosmetic ID (UUID)
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GetByIdCosmeticsResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/dto.HTTPStatus'
        "404":
          description: Cosmetic not found
          schema:
            $ref: '#/definitions/dto.HTTPStatus'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.HTTPStatus'
      summary: Get cosmetic by ID
      tags:
      - cosmetics
    patch:
      consumes:
      - application/json
      description: Updates cosmetic product fields by given ID.
      parameters:
      - description: Cosmetic ID (UUID)
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Updated cosmetic fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCosmeticsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UpdateCosmeticsResponse'
        "400":
          description: Validation or binding error
          schema:
            $ref: '#/definitions/dto.HTTPStatus'
        "404":
          description: Cosmetic not found
          schema:
            $ref: '#/definitions/dto.HTTPStatus'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.HTTPStatus'
      security:
      - CookieAuth: []
      summary: Update cosmetic
      tags:
      - cosmetics
  /api/v1/info/corporation:
    get:
      consumes:
      - application/json
      description: 'Returns the current public corporation information: heading, description,
        fluid status, schedule, and links.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GetInfoResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.HTTPStatus'
      summary: Get corporation info
      tags:
      - info
    patch:
      consumes:
      - application/json
      description: |-
        Updates the corporation info fields. Only accessible by authenticated moderators.
        Requires authentication via cookies (access_token, refresh_token)
      parameters:
      - description: Updated corporation info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateInfoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UpdateInfoResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/dto.HTTPStatus'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.HTTPStatus'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.HTTPStatus'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.HTTPStatus'
      security:
      - CookieAuth: []
      summary: UpdateCurrent corporation info
      tags:
      - info
  /api/v1/order:
    post:
      consumes:
      - application/json
      description: Creates a new leech order and send it to email.
      parameters:
      - description: Leech order data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CreateOrderResponse'
        "400":
          description: Invalid request body or validation error
          schema:
            $ref: '#/definitions/dto.HTTPStatus'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.HTTPStatus'
      summary: Create a new leech order
      tags:
      - order
  /api/v1/partner:
    get:
      consumes:
      - application/json
      description: Retrieves a list of partners with pagination.
      parameters:
      - description: Max number of items
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Offset for pagination
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.Partner'
            type: array
        "400":
